name: NAF Flow

on:
  push:
    branches: [main, 'v*-rc']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer test
      - run: composer style:check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-progress
      - run: npm ci
      - run: npm run style:check
      - run: npm run build
      - name: Verify the shipped runtime matches its source
        run: git diff --exit-code -- src/Resources/public/flow.min.js
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
